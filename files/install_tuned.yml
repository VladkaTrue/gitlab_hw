- name: Install and configure tuned
  hosts: vms
  become: yes
  tasks:
    - name: Install tuned package
      apt:
        name: tuned
        state: present
        update_cache: yes

    - name: Start tuned service
      systemd:
        name: tuned
        state: started

    - name: Enable tuned on boot
      systemd:
        name: tuned
        enabled: yes
