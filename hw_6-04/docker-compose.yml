version: '3.8'
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ChernyshevVV-netology-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - 9090:9090
    networks:
      default:
        ipv4_address: 10.5.0.10

volumes:
  prometheus_data:

networks:
  default:
    name: ChernyshevVV-my-netology-hw
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16