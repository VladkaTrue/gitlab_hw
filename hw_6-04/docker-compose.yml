version: '4'
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ChernyshevVV-netology-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - 9090:9090
    networks:
      default:
        ipv4_address: 10.5.0.10

  pushgateway:
    image: prom/pushgateway:latest
    container_name: ChernyshevVV-netology-pushgateway
    volumes:
      - pushgateway_data:/pushgateway
    ports:
      - 9091:9091
    networks:
      default:
        ipv4_address: 10.5.0.11

  grafana:
    image: grafana/grafana:latest
    container_name: ChernyshevVV-netology-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - grafana_config:/diff/etc/grafana/grafana.ini
      - grafana_custom:/home/vladislove/Документы/GitHub/gitlab_hw/hw_6-04/grafana/custom.ini
    ports:
      - 3000:80
    networks:
      default:
        ipv4_address: 10.5.0.12

volumes:
  prometheus_data:
  pushgateway_data:
  grafana_data:
  grafana_config:
  grafana_custom:

networks:
  default:
    name: ChernyshevVV-my-netology-hw
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16